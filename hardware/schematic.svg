<text x="550" y="515">R3 10k</text><text x="550" y="580">R4 10k</text>
<text x="510" y="469">3.3 V</text><text x="514" y="632">GND</text>
<text x="685" y="558">C5 100nF to GND</text><text x="685" y="538">MID → U2 pin 5 (+B)</text>
<text x="730" y="596">U2 pin 6 (−B) → pin 7 (OUT B)</text>
<text x="36" y="665" class="small">D1/D2 are rail clamps only. They do not expand the allowed input range. Power the board before applying a signal.</text>
<text x="36" y="689" class="small">R1/C1 nominal pole: 72.3kHz. This is not a steep anti-alias filter. See analog-design.md and wiring.md.</text>
