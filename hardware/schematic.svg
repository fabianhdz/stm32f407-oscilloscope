<text x="36" y="491">U2 pin 8 → 3.3 V; pin 4 → GND</text>
<text x="36" y="517">C3 100nF directly across pins 8/4</text>
<text x="36" y="543">C4 10µF across 3.3 V/GND</text>
<text x="36" y="569">J1 GND → board analog ground</text>
<g class="wire"><path d="M530 475V490 M530 530V550 M530 590V610 M530 540H665 M665 540V555 M665 565V610"/></g>
